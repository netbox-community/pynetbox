version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  # Zensical is not one of the builders Read the Docs supports natively, so the site
  # is built explicitly and copied into the expected output directory. mkdocstrings
  # imports the package to generate the API reference, so pynetbox itself has to be
  # installed, not just the docs dependencies from the `dev` extra.
  commands:
    - pip install ".[dev]"
    - python -m zensical build --clean
    - mkdir -p $READTHEDOCS_OUTPUT/html/
    - cp -r site/* $READTHEDOCS_OUTPUT/html/
