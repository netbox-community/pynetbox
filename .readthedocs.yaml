version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

# Build the mkdocs-material site; this project does not use Sphinx.
mkdocs:
  configuration: mkdocs.yml

# Install pynetbox plus its docs tooling (mkdocs-material, mkdocstrings) from the
# `dev` extra. mkdocstrings imports the package to generate the API reference, so
# the package itself has to be installed, not just the docs dependencies.
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - dev
